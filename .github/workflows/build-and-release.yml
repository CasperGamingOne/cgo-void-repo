name: Build and Release XBPS Packages

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/xbps-src-masterdir:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare build environment
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y xtools openssl git
          cd void-packages
          echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
          ./xbps-src binary-bootstrap

      - name: Link templates
        run: |
          for pkg in cgo-void-repo/srcpkgs/*; do
            if [ -d "$pkg" ]; then
              pkgname=$(basename "$pkg")
              echo "Linking $pkgname..."
              ln -s "../../$pkg" "void-packages/srcpkgs/$pkgname"
            fi
          done

      - name: Build packages
        run: |
          cd void-packages
          for pkg in ../cgo-void-repo/srcpkgs/*; do
            if [ -d "$pkg" ]; then
              pkgname=$(basename "$pkg")
              echo "Building $pkgname..."
              ./xbps-src pkg "$pkgname"
            fi
          done

      - name: Index and sign packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          mkdir -p cgo-void-repo/dist
          ARCH=$(xbps-uhelper arch)
          cp -r void-packages/hostdir/binpkgs/* cgo-void-repo/dist/ || true
          
          cd cgo-void-repo/dist
          if [ -n "$RSA_KEY" ]; then
            echo "$RSA_KEY" > signing.key
            chmod 600 signing.key
            xbps-rindex -a ./*.xbps || true
            xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key .
            rm -f signing.key
          else
            xbps-rindex -a ./*.xbps || true
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: cgo-void-repo/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
