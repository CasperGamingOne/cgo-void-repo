name: Build, Sign and Deploy cgo-void-repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
      - 'docs/**'
      - 'scripts/**'
      - 'repo-keys/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Packages & Generate Site
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo
          fetch-depth: 0

      - name: Install dependencies & detect modified files
        id: changes
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y git shadow python3 ca-certificates openssl xtools

          # Setup builder user in xbuilder group for xbps-uchroot permissions
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder

          cd "$GITHUB_WORKSPACE/cgo-void-repo"
          git config --global --add safe.directory "*"

          BEFORE="${{ github.event.before }}"
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$REF" == refs/tags/* ]] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "==> Full build triggered (dispatch, tag, or new branch/commit)."
            echo "build_pkgs=true" >> "$GITHUB_OUTPUT"
            echo "force_all=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=ALL" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "==> Files modified in this push:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -q '^srcpkgs/'; then
              echo "==> Package modifications detected in srcpkgs/."
              echo "build_pkgs=true" >> "$GITHUB_OUTPUT"
            else
              echo "==> No template modifications in srcpkgs/. Skipping package build steps."
              echo "build_pkgs=false" >> "$GITHUB_OUTPUT"
            fi
            echo "force_all=false" >> "$GITHUB_OUTPUT"

            EOF_MARKER=$(openssl rand -hex 8)
            echo "changed_files<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout void-packages
        if: steps.changes.outputs.build_pkgs == 'true'
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare xbps-src build engine
        if: steps.changes.outputs.build_pkgs == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            git config --global --add safe.directory "*"
            cd "$GITHUB_WORKSPACE/void-packages"
            echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
            echo "XBPS_USE_BUILD_MTIME=yes" >> etc/conf
            echo "XBPS_MAKEJOBS=$(nproc)" >> etc/conf
            ./xbps-src binary-bootstrap
          EOF

      - name: Build modified package templates
        if: steps.changes.outputs.build_pkgs == 'true'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
          FORCE_ALL: ${{ steps.changes.outputs.force_all }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env CHANGED_FILES="$CHANGED_FILES" FORCE_ALL="$FORCE_ALL" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            cd "$GITHUB_WORKSPACE"
            for pkg in cgo-void-repo/srcpkgs/*; do
              if [ -d "$pkg" ] && [ -f "$pkg/template" ]; then
                pkgname=$(basename "$pkg")
                if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED_FILES" | grep -q "^srcpkgs/$pkgname/"; then
                  echo "==> Building $pkgname (changes detected in srcpkgs/$pkgname)..."
                  rm -rf "void-packages/srcpkgs/$pkgname"
                  cp -a "$pkg" "void-packages/srcpkgs/$pkgname"
                  cd void-packages
                  ./xbps-src pkg "$pkgname"
                  cd "$GITHUB_WORKSPACE"
                else
                  echo "==> Skipping $pkgname: no changes detected in srcpkgs/$pkgname"
                fi
              fi
            done
          EOF

      - name: Generate static website & index packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          REPO_SLUG: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env RSA_KEY="$RSA_KEY" REPO_SLUG="$REPO_SLUG" GH_TOKEN="$GH_TOKEN" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            cd "$GITHUB_WORKSPACE"
            ARCH=$(xbps-uhelper arch)
            SITE_DIR="cgo-void-repo/site"
            DIST_DIR="${SITE_DIR}/${ARCH}"
            mkdir -p "$DIST_DIR"

            # 1. Recover existing binary packages from gh-pages so unchanged packages are preserved
            if git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" existing_gh_pages 2>/dev/null; then
              echo "==> Recovering existing binary packages from gh-pages..."
              if [ -d "existing_gh_pages/${ARCH}" ]; then
                cp -uv existing_gh_pages/${ARCH}/*.xbps "$DIST_DIR/" 2>/dev/null || true
              fi
              rm -rf existing_gh_pages
            fi

            # 2. Run dynamic site generator
            python3 cgo-void-repo/scripts/generate-web.py "$SITE_DIR"

            # 3. Copy newly built packages from this run into the architecture directory
            if [ -d "void-packages/hostdir/binpkgs" ]; then
              find void-packages/hostdir/binpkgs -type f -name "*.xbps" -exec cp -uv {} "$DIST_DIR/" \; || true
            fi

            # 4. Sign repodata
            cd "$DIST_DIR"
            if [ -n "${RSA_KEY:-}" ]; then
              echo "==> Signing repodata using GitHub Secret RSA_PRIVATE_KEY..."
              echo "$RSA_KEY" > signing.key
              chmod 600 signing.key
              xbps-rindex -a ./*.xbps || true
              xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key . || true
              xbps-rindex -c . || true
              rm -f signing.key
            else
              echo "==> Notice: RSA_PRIVATE_KEY secret not found, indexing without signature..."
              xbps-rindex -a ./*.xbps || true
            fi
          EOF

      - name: Fix workspace permissions for artifact upload
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/site"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cgo-void-repo/site

      - name: Upload Built Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-site-and-packages
          path: cgo-void-repo/site/**/*

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: xbps-site-and-packages
          path: site

      # 1. Push to gh-pages branch (creates/updates gh-pages branch automatically)
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      # 2. Deploy directly via GitHub Pages Actions API
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-site-and-packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
