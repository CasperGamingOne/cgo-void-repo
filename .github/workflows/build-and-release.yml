name: Build, Sign and Deploy cgo-void-repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare build environment
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y xtools git openssl ca-certificates shadow
          
          # Add builder to xbuilder group so xbps-uchroot (SUID root) can be used
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/void-packages"
            echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
            echo "XBPS_MAKEJOBS=$(nproc)" >> etc/conf
            ./xbps-src binary-bootstrap
          EOF

      - name: Link and build custom templates
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            for pkg in cgo-void-repo/srcpkgs/*; do
              if [ -d "$pkg" ] && [ -f "$pkg/template" ]; then
                pkgname=$(basename "$pkg")
                echo "==> Linking $pkgname..."
                ln -sf "../../$pkg" "void-packages/srcpkgs/$pkgname"
                echo "==> Building $pkgname with xbps-src..."
                cd void-packages
                ./xbps-src pkg "$pkgname"
                cd "$GITHUB_WORKSPACE"
              fi
            done
          EOF

      - name: Index and sign packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env RSA_KEY="$RSA_KEY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            ARCH=$(xbps-uhelper arch)
            DIST_DIR="cgo-void-repo/docs/$ARCH"
            mkdir -p "$DIST_DIR"
            
            # Copy built binary packages to docs directory for GitHub Pages
            find void-packages/hostdir/binpkgs -type f -name "*.xbps" -exec cp -uv {} "$DIST_DIR/" \; || true

            cd "$DIST_DIR"
            if [ -n "${RSA_KEY:-}" ]; then
              echo "==> Signing repodata using GitHub Secret RSA_PRIVATE_KEY..."
              echo "$RSA_KEY" > signing.key
              chmod 600 signing.key
              xbps-rindex -a ./*.xbps || true
              xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key . || true
              xbps-rindex -c . || true
              rm -f signing.key
            else
              echo "==> Notice: RSA_PRIVATE_KEY secret not found, indexing without signature..."
              xbps-rindex -a ./*.xbps || true
            fi
          EOF

      - name: Fix workspace permissions for artifact upload
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/docs"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cgo-void-repo/docs

      - name: Upload Release Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages
          path: cgo-void-repo/docs/**/*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
