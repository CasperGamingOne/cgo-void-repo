name: Build, Sign and Deploy cgo-void-repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
      - 'docs/**'
      - 'scripts/**'
      - 'repo-keys/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild of all packages (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Packages & Generate Site
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Install dependencies & tools
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y git shadow python3 ca-certificates openssl xtools curl

          # Setup builder user in xbuilder group for xbps-uchroot permissions
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder

      - name: Check repository package state & recover existing binaries
        id: pkg_check
        run: |
          ARCH=$(xbps-uhelper arch 2>/dev/null || uname -m)
          DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64"
          DIST_V3_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64-v3"
          SITE_DIR="$GITHUB_WORKSPACE/cgo-void-repo/site"
          mkdir -p "$DIST_DIR" "$DIST_V3_DIR" "$SITE_DIR"

          # 1. Recover existing binary packages from GitHub Releases (both channels)
          echo "==> Fetching existing packages from GitHub Releases..."
          python3 -c "
          import urllib.request, json, os

          repo = '${{ github.repository }}'
          headers = {'User-Agent': 'CI', 'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}'}

          for tag, dest in [('rolling', '$DIST_DIR'), ('rolling-v3', '$DIST_V3_DIR')]:
              url = f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.load(resp)
                      for asset in data.get('assets', []):
                          name = asset['name']
                          if name.endswith('.xbps') or name.endswith('.sig2') or name.endswith('-repodata'):
                              dl_url = asset['browser_download_url']
                              print(f'==> Downloading [{tag}] asset: {name}')
                              urllib.request.urlretrieve(dl_url, os.path.join(dest, name))
              except Exception as e:
                  print(f'Notice: Could not fetch prior [{tag}] release assets ({e}). Building fresh.')
          " || true

          # 2. Check which packages in srcpkgs need building
          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          PKGS_TO_BUILD=""

          for pkg_dir in "$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/"*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/template" ]; then
              pkgname=$(basename "$pkg_dir")
              ver=$(grep "^version=" "$pkg_dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
              rev=$(grep "^revision=" "$pkg_dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
              expected_bin="${pkgname}-${ver}_${rev}.${ARCH}.xbps"

              if [ "$FORCE" != "true" ] && [ -f "$DIST_DIR/$expected_bin" ]; then
                echo "==> Package '$pkgname' version $ver_$rev is already built ($expected_bin). Skipping."
              else
                echo "==> Package '$pkgname' ($expected_bin) is NOT present in repo. Mark for build!"
                PKGS_TO_BUILD="${PKGS_TO_BUILD} ${pkgname}"
              fi
            fi
          done

          PKGS_TO_BUILD=$(echo "$PKGS_TO_BUILD" | xargs)
          echo "Packages scheduled for build: '${PKGS_TO_BUILD}'"

          if [ -n "$PKGS_TO_BUILD" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "pkgs=${PKGS_TO_BUILD}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout void-packages
        if: steps.pkg_check.outputs.needs_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare xbps-src build engine
        if: steps.pkg_check.outputs.needs_build == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            git config --global --add safe.directory "*"
            cd "$GITHUB_WORKSPACE/void-packages"
            echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf

            # Setup x86_64-v3 optimization profile
            echo "XBPS_ALLOW_RESTRICTED=yes" > etc/conf.x86_64-v3
            echo 'XBPS_CFLAGS="-O3 -march=x86-64-v3 -pipe"' >> etc/conf.x86_64-v3
            echo 'XBPS_CXXFLAGS="-O3 -march=x86-64-v3 -pipe"' >> etc/conf.x86_64-v3
            echo 'XBPS_TARGET_CFLAGS="-march=x86-64-v3 -mtune=generic"' >> etc/conf.x86_64-v3
            echo 'XBPS_TARGET_CXXFLAGS="${XBPS_TARGET_CFLAGS}"' >> etc/conf.x86_64-v3
            ./xbps-src binary-bootstrap
          EOF

      - name: Build packages (generic and v3)
        if: steps.pkg_check.outputs.needs_build == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            cd "$GITHUB_WORKSPACE"

            PKGS="${{ steps.pkg_check.outputs.pkgs }}"
            DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64"
            DIST_V3_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64-v3"
            mkdir -p "$DIST_DIR" "$DIST_V3_DIR"

            for pkgname in $PKGS; do
              echo "==> Building package '$pkgname'..."
              rm -rf "void-packages/srcpkgs/$pkgname"
              cp -a "$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/$pkgname" "void-packages/srcpkgs/$pkgname"
              
              cd void-packages
              # 1. Build generic
              ./xbps-src pkg "$pkgname"
              find hostdir/binpkgs -type f -name "${pkgname}-*.xbps" -exec cp -uv {} "$DIST_DIR/" \; || true

              # 2. Build or mirror v3
              if [[ "$pkgname" == "noctalia"* || "$pkgname" == "umbriel"* || "$pkgname" == "xdg-desktop-portal-umbriel"* ]]; then
                ./xbps-src -c x86_64-v3 -f pkg "$pkgname"
                find hostdir/binpkgs -type f -name "${pkgname}-*.xbps" -exec cp -uv {} "$DIST_V3_DIR/" \; || true
              else
                # Universal binary package: mirror
                find "$DIST_DIR" -type f -name "${pkgname}-*.xbps" -exec cp -uv {} "$DIST_V3_DIR/" \; || true
              fi

              cd "$GITHUB_WORKSPACE"
            done
          EOF

      - name: Generate static website & index packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env RSA_KEY="$RSA_KEY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            SITE_DIR="$GITHUB_WORKSPACE/cgo-void-repo/site"
            DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64"
            DIST_V3_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64-v3"

            # 1. Run dynamic site generator
            python3 "$GITHUB_WORKSPACE/cgo-void-repo/scripts/generate-web.py" "$SITE_DIR"
            cp -a "$GITHUB_WORKSPACE/cgo-void-repo/docs/style.css" "$GITHUB_WORKSPACE/cgo-void-repo/docs/app.js" "$SITE_DIR/" 2>/dev/null || true
            touch "$SITE_DIR/.nojekyll"

            # 2. Index and sign both distribution directories
            for dir in "$DIST_DIR" "$DIST_V3_DIR"; do
              if [ -d "$dir" ] && ls "$dir"/*.xbps >/dev/null 2>&1; then
                cd "$dir"
                echo "==> Indexing packages in $dir..."
                xbps-rindex -a ./*.xbps || true

                if [ -n "${RSA_KEY:-}" ]; then
                  echo "==> Signing packages and repodata in $dir..."
                  echo "$RSA_KEY" > signing.key
                  chmod 600 signing.key
                  rm -f ./*.sig2
                  xbps-rindex --sign-pkg --privkey signing.key ./*.xbps || true
                  xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key . || true
                  xbps-rindex -c . || true
                  rm -f signing.key
                fi
              fi
            done
          EOF

      - name: Fix workspace permissions for artifact upload
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/site"
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/dist"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cgo-void-repo/site

      - name: Upload Built Generic Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages-generic
          path: cgo-void-repo/dist/x86_64/*

      - name: Upload Built v3 Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages-v3
          path: cgo-void-repo/dist/x86_64-v3/*

  deploy-pages:
    name: Deploy Website to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-generic:
    name: Publish Generic Packages to rolling
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download generic packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-packages-generic
          path: dist/x86_64

      - name: Publish / Update rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "Rolling Package Release (Generic x86_64)"
          body: |
            Automated baseline binary package builds for `cgo-void-repo` (Void Linux).
            Universal compatibility for all 64-bit x86 systems.
            
            ### Setup
            ```bash
            sudo wget -O /var/db/xbps/keys/cgo-void-repo.pem https://caspergamingone.github.io/cgo-void-repo/cgo-void-repo.pem
            echo "repository=https://github.com/CasperGamingOne/cgo-void-repo/releases/download/rolling" | sudo tee /etc/xbps.d/10-cgo-void-repo.conf
            sudo xbps-install -S
            ```
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/x86_64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-v3:
    name: Publish Optimized Packages to rolling-v3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download v3 packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-packages-v3
          path: dist/x86_64-v3

      - name: Publish / Update rolling-v3 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-v3
          name: "Rolling Package Release (x86_64-v3 Optimized)"
          body: |
            Optimized microarchitecture package builds for `cgo-void-repo` (Void Linux).
            Compiled with `-march=x86-64-v3 -O3 -pipe` (AVX, AVX2, FMA, BMI1/2).
            
            ### Setup
            ```bash
            sudo wget -O /var/db/xbps/keys/cgo-void-repo.pem https://caspergamingone.github.io/cgo-void-repo/cgo-void-repo.pem
            echo "repository=https://github.com/CasperGamingOne/cgo-void-repo/releases/download/rolling-v3" | sudo tee /etc/xbps.d/10-cgo-void-repo.conf
            sudo xbps-install -S
            ```
          draft: false
          prerelease: false
          make_latest: "false"
          files: dist/x86_64-v3/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
