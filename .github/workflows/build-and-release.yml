name: Build, Sign and Deploy cgo-void-repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
      - 'docs/**'
      - 'scripts/**'
      - 'repo-keys/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild of all packages (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Packages & Generate Site
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Install dependencies & tools
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y git shadow python3 ca-certificates openssl xtools

          # Setup builder user in xbuilder group for xbps-uchroot permissions
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder

      - name: Check repository package state & recover existing packages
        id: pkg_check
        run: |
          ARCH=$(xbps-uhelper arch 2>/dev/null || uname -m)
          SITE_DIR="$GITHUB_WORKSPACE/cgo-void-repo/site"
          DIST_DIR="${SITE_DIR}/${ARCH}"
          mkdir -p "$DIST_DIR"

          # 1. Recover existing binary packages from gh-pages branch
          echo "==> Fetching current binary packages from gh-pages..."
          if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" existing_gh_pages 2>/dev/null; then
            if [ -d "existing_gh_pages/${ARCH}" ]; then
              cp -uv existing_gh_pages/${ARCH}/*.xbps "$DIST_DIR/" 2>/dev/null || true
              echo "==> Recovered existing binary packages:"
              ls -la "$DIST_DIR"
            fi
            rm -rf existing_gh_pages
          fi

          # 2. Check which packages in srcpkgs need building
          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          PKGS_TO_BUILD=""

          for pkg_dir in "$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/"*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/template" ]; then
              pkgname=$(basename "$pkg_dir")
              ver=$(grep "^version=" "$pkg_dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
              rev=$(grep "^revision=" "$pkg_dir/template" | cut -d'=' -f2 | tr -d '"' | tr -d "'")
              expected_bin="${pkgname}-${ver}_${rev}.${ARCH}.xbps"

              if [ "$FORCE" != "true" ] && [ -f "$DIST_DIR/$expected_bin" ]; then
                echo "==> Package '$pkgname' version $ver_$rev is already built ($expected_bin). Skipping."
              else
                echo "==> Package '$pkgname' ($expected_bin) is NOT present in repo. Mark for build!"
                PKGS_TO_BUILD="${PKGS_TO_BUILD} ${pkgname}"
              fi
            fi
          done

          PKGS_TO_BUILD=$(echo "$PKGS_TO_BUILD" | xargs)
          echo "Packages scheduled for build: '${PKGS_TO_BUILD}'"

          if [ -n "$PKGS_TO_BUILD" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "pkgs=${PKGS_TO_BUILD}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "pkgs=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout void-packages
        if: steps.pkg_check.outputs.needs_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare xbps-src build engine
        if: steps.pkg_check.outputs.needs_build == 'true'
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            git config --global --add safe.directory "*"
            cd "$GITHUB_WORKSPACE/void-packages"
            echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf
            echo "XBPS_USE_BUILD_MTIME=yes" >> etc/conf
            echo "XBPS_MAKEJOBS=$(nproc)" >> etc/conf
            ./xbps-src binary-bootstrap
          EOF

      - name: Build scheduled packages
        if: steps.pkg_check.outputs.needs_build == 'true'
        env:
          BUILD_PKGS: ${{ steps.pkg_check.outputs.pkgs }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env BUILD_PKGS="$BUILD_PKGS" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            ARCH=$(xbps-uhelper arch 2>/dev/null || uname -m)
            DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/site/${ARCH}"

            for pkgname in $BUILD_PKGS; do
              echo "==> Building $pkgname with xbps-src..."
              rm -rf "void-packages/srcpkgs/$pkgname"
              cp -a "$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/$pkgname" "void-packages/srcpkgs/$pkgname"
              cd void-packages
              ./xbps-src pkg "$pkgname"
              cd "$GITHUB_WORKSPACE"
            done

            # Copy newly built packages into the distribution directory
            if [ -d "void-packages/hostdir/binpkgs" ]; then
              find void-packages/hostdir/binpkgs -type f -name "*.xbps" -exec cp -uv {} "$DIST_DIR/" \; || true
            fi
          EOF

      - name: Generate static website & index packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env RSA_KEY="$RSA_KEY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            ARCH=$(xbps-uhelper arch 2>/dev/null || uname -m)
            SITE_DIR="$GITHUB_WORKSPACE/cgo-void-repo/site"
            DIST_DIR="${SITE_DIR}/${ARCH}"
            mkdir -p "$DIST_DIR"

            # 1. Run dynamic site generator
            python3 "$GITHUB_WORKSPACE/cgo-void-repo/scripts/generate-web.py" "$SITE_DIR"

            # 2. Sign repodata
            cd "$DIST_DIR"
            echo "==> Packages in repository index:"
            ls -la ./*.xbps || true

            if [ -n "${RSA_KEY:-}" ]; then
              echo "==> Signing repodata using GitHub Secret RSA_PRIVATE_KEY..."
              echo "$RSA_KEY" > signing.key
              chmod 600 signing.key
              xbps-rindex -a ./*.xbps || true
              xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key . || true
              xbps-rindex -c . || true
              rm -f signing.key
            else
              echo "==> Notice: RSA_PRIVATE_KEY secret not found, indexing without signature..."
              xbps-rindex -a ./*.xbps || true
            fi
          EOF

      - name: Fix workspace permissions for artifact upload
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/site"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cgo-void-repo/site

      - name: Upload Built Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-site-and-packages
          path: cgo-void-repo/site/**/*

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: xbps-site-and-packages
          path: site

      # 1. Push to gh-pages branch (creates/updates gh-pages branch automatically)
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      # 2. Deploy directly via GitHub Pages Actions API
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-site-and-packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
