name: Build, Sign and Deploy cgo-void-repo

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'srcpkgs/**'
      - 'docs/**'
      - 'scripts/**'
      - 'repo-keys/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild of all packages (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  notify-start:
    name: Notify Discord on CI Start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send Discord Start Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          python3 scripts/notify-ci.py started

  plan-builds:
    name: Plan Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix_planner.outputs.matrix }}
      needs_build: ${{ steps.matrix_planner.outputs.needs_build }}
      pkgs: ${{ steps.matrix_planner.outputs.pkgs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Parallel Matrix
        id: matrix_planner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          python3 scripts/generate-matrix.py

  build-package:
    name: Build ${{ matrix.pkg }} (${{ matrix.channel }})
    needs: plan-builds
    if: needs.plan-builds.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-builds.outputs.matrix) }}
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Install dependencies & tools
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y git shadow python3 ca-certificates openssl xtools curl
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder
          chown root:xbuilder /usr/bin/xbps-uchroot || true
          chmod 4750 /usr/bin/xbps-uchroot || true

      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare xbps-src build engine
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            git config --global --add safe.directory "*"
            cd "$GITHUB_WORKSPACE/void-packages"
            echo "XBPS_CHROOT_CMD=uchroot" >> etc/conf
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf

            # Setup x86_64-v3 optimization profile
            echo "XBPS_CHROOT_CMD=uchroot" > etc/conf.x86_64-v3
            echo "XBPS_ALLOW_RESTRICTED=yes" >> etc/conf.x86_64-v3
            echo 'XBPS_CFLAGS="-O3 -march=x86-64-v3 -pipe"' >> etc/conf.x86_64-v3
            echo 'XBPS_CXXFLAGS="-O3 -march=x86-64-v3 -pipe"' >> etc/conf.x86_64-v3
            echo 'XBPS_TARGET_CFLAGS="-march=x86-64-v3 -mtune=generic"' >> etc/conf.x86_64-v3
            echo 'XBPS_TARGET_CXXFLAGS="${XBPS_TARGET_CFLAGS}"' >> etc/conf.x86_64-v3
            ./xbps-src binary-bootstrap
          EOF

      - name: Compile Package
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            cd "$GITHUB_WORKSPACE"

            PKG="${{ matrix.pkg }}"
            CHANNEL="${{ matrix.channel }}"
            PKG_OUT="$GITHUB_WORKSPACE/binpkgs"
            mkdir -p "$PKG_OUT"

            # 1. Copy package template and related subpackage symlinks
            source_pkg_dir="$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/$PKG"
            rm -rf "void-packages/srcpkgs/$PKG"
            cp -a "$source_pkg_dir" "void-packages/srcpkgs/$PKG"

            for template in "$GITHUB_WORKSPACE/cgo-void-repo/srcpkgs/"*; do
              [ -L "$template" ] || continue
              [ "$(readlink "$template")" = "$PKG" ] || continue
              template_name=$(basename "$template")
              rm -rf "void-packages/srcpkgs/$template_name"
              cp -a "$template" "void-packages/srcpkgs/$template_name"
            done

            cd void-packages
            echo "==> Compiling '$PKG' for channel '$CHANNEL'..."

            if [ "$CHANNEL" = "x86_64-v3" ]; then
              ./xbps-src -c x86_64-v3 -f pkg "$PKG"
            else
              ./xbps-src pkg "$PKG"
            fi

            # Collect binaries (explicitly exclude any huge debug archives)
            find hostdir/binpkgs -type f -name "${PKG}*.xbps" ! -name "*-dbg*.xbps" -exec cp -uv {} "$PKG_OUT/" \; || true
          EOF

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-${{ matrix.pkg }}-${{ matrix.channel }}
          path: binpkgs/*

  assemble-and-publish:
    name: Assemble, Sign & Index Packages
    needs: [plan-builds, build-package]
    if: always() && needs.plan-builds.outputs.needs_build == 'true' && (needs.build-package.result == 'success' || needs.build-package.result == 'failure')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Checkout cgo-void-repo
        uses: actions/checkout@v4
        with:
          path: cgo-void-repo

      - name: Install dependencies & tools
        run: |
          xbps-install -Syu || xbps-install -u xbps && xbps-install -Syu
          xbps-install -y git shadow python3 ca-certificates openssl xtools curl
          useradd -m -G xbuilder -s /bin/bash builder || usermod -aG xbuilder builder

      - name: Recover existing release binaries
        run: |
          DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64"
          DIST_V3_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64-v3"
          mkdir -p "$DIST_DIR" "$DIST_V3_DIR"

          python3 -c "
          import urllib.request, json, os

          repo = '${{ github.repository }}'
          headers = {'User-Agent': 'CI', 'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}'}

          for tag, dest in [('rolling', '$DIST_DIR'), ('rolling-v3', '$DIST_V3_DIR')]:
              url = f'https://api.github.com/repos/{repo}/releases/tags/{tag}'
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.load(resp)
                      for asset in data.get('assets', []):
                          name = asset['name']
                          if name.endswith('.xbps') or name.endswith('.sig2') or name.endswith('-repodata'):
                              # Skip legacy dbg assets
                              if '-dbg' in name:
                                  continue
                              dl_url = asset['browser_download_url']
                              print(f'==> Downloading [{tag}] asset: {name}')
                              urllib.request.urlretrieve(dl_url, os.path.join(dest, name))
              except Exception as e:
                  print(f'Notice: Could not fetch prior [{tag}] release assets ({e}).')
          " || true

      - name: Download all newly built packages
        uses: actions/download-artifact@v4
        with:
          path: downloaded-binpkgs

      - name: Merge, Index, and Sign Packages
        env:
          RSA_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -g xbuilder -- env RSA_KEY="$RSA_KEY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash << 'EOF'
            set -euo pipefail
            export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
            DIST_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64"
            DIST_V3_DIR="$GITHUB_WORKSPACE/cgo-void-repo/dist/x86_64-v3"
            mkdir -p "$DIST_DIR" "$DIST_V3_DIR"

            # 1. Distribute downloaded artifacts into dist/
            if [ -d "$GITHUB_WORKSPACE/downloaded-binpkgs" ]; then
              for art_dir in "$GITHUB_WORKSPACE/downloaded-binpkgs/binpkgs-"*; do
                if [ -d "$art_dir" ]; then
                  art_name=$(basename "$art_dir")
                  echo "==> Merging artifact: $art_name"
                  if [[ "$art_name" == *"-generic" ]]; then
                    find "$art_dir" -type f -name "*.xbps" ! -name "*-dbg*" -exec cp -uv {} "$DIST_DIR/" \; || true
                    pkg=$(echo "$art_name" | sed -e 's/^binpkgs-//' -e 's/-generic$//')
                    if [[ ! "$pkg" =~ ^(ananicy-cpp|linux-cachyos-lts|noctalia|umbriel|xdg-desktop-portal-umbriel|vmware-workstation)$ ]]; then
                      find "$art_dir" -type f -name "*.xbps" ! -name "*-dbg*" -exec cp -uv {} "$DIST_V3_DIR/" \; || true
                    fi
                  elif [[ "$art_name" == *"-x86_64-v3" ]]; then
                    find "$art_dir" -type f -name "*.xbps" ! -name "*-dbg*" -exec cp -uv {} "$DIST_V3_DIR/" \; || true
                  fi
                fi
              done
            fi

            # Clean any dangling dbg files
            rm -f "$DIST_DIR"/*-dbg* "$DIST_V3_DIR"/*-dbg*

            # 2. Index and sign both distribution directories
            for dir in "$DIST_DIR" "$DIST_V3_DIR"; do
              if [ -d "$dir" ] && ls "$dir"/*.xbps >/dev/null 2>&1; then
                cd "$dir"
                echo "==> Indexing packages in $dir..."
                xbps-rindex -a ./*.xbps || true

                if [ -n "${RSA_KEY:-}" ]; then
                  echo "==> Signing packages and repodata in $dir..."
                  echo "$RSA_KEY" > signing.key
                  chmod 600 signing.key
                  rm -f ./*.sig2
                  xbps-rindex --sign-pkg --privkey signing.key ./*.xbps || true
                  xbps-rindex --sign --signedby "CasperGamingOne Void Repository" --privkey signing.key . || true
                  xbps-rindex -c . || true
                  rm -f signing.key
                fi
              fi
            done
          EOF

      - name: Fix workspace permissions for artifact upload
        run: |
          chmod -R 777 "$GITHUB_WORKSPACE/cgo-void-repo/dist"

      - name: Upload Consolidated Generic Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages-generic
          path: cgo-void-repo/dist/x86_64/*

      - name: Upload Consolidated v3 Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbps-packages-v3
          path: cgo-void-repo/dist/x86_64-v3/*

  release-generic:
    name: Publish Generic Packages to rolling
    needs: [assemble-and-publish]
    if: always() && needs.assemble-and-publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download generic packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-packages-generic
          path: dist/x86_64

      - name: Publish / Update rolling Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "Rolling Package Release (Generic x86_64)"
          body: |
            Automated baseline binary package builds for `cgo-void-repo` (Void Linux).
            Universal compatibility for all 64-bit x86 systems.
            
            ### Setup
            ```bash
            sudo wget -O /var/db/xbps/keys/cgo-void-repo.pem https://caspergamingone.github.io/cgo-void-repo/cgo-void-repo.pem
            echo "repository=https://github.com/CasperGamingOne/cgo-void-repo/releases/download/rolling" | sudo tee /etc/xbps.d/10-cgo-void-repo.conf
            sudo xbps-install -S
            ```
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/x86_64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-v3:
    name: Publish Optimized Packages to rolling-v3
    needs: [assemble-and-publish]
    if: always() && needs.assemble-and-publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download v3 packages
        uses: actions/download-artifact@v4
        with:
          name: xbps-packages-v3
          path: dist/x86_64-v3

      - name: Publish / Update rolling-v3 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-v3
          name: "Rolling Package Release (x86_64-v3 Optimized)"
          body: |
            Optimized microarchitecture package builds for `cgo-void-repo` (Void Linux).
            Compiled with `-march=x86-64-v3 -O3 -pipe` (AVX, AVX2, FMA, BMI1/2).
            
            ### Setup
            ```bash
            sudo wget -O /var/db/xbps/keys/cgo-void-repo.pem https://caspergamingone.github.io/cgo-void-repo/cgo-void-repo.pem
            echo "repository=https://github.com/CasperGamingOne/cgo-void-repo/releases/download/rolling-v3" | sudo tee /etc/xbps.d/10-cgo-void-repo.conf
            sudo xbps-install -S
            ```
          draft: false
          prerelease: false
          make_latest: "false"
          files: dist/x86_64-v3/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Build & Deploy Website to GitHub Pages
    needs: [plan-builds, assemble-and-publish]
    if: always() && !cancelled() && (needs.assemble-and-publish.result == 'success' || needs.assemble-and-publish.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate static website
        run: |
          python3 scripts/generate-web.py site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-finish:
    name: Notify Discord on CI Result
    needs: [plan-builds, build-package, assemble-and-publish, deploy-website]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send Discord Result Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build-package.result }}
          PAGES_RESULT: ${{ needs.deploy-website.result }}
          GENERIC_RESULT: ${{ needs.assemble-and-publish.result }}
          V3_RESULT: ${{ needs.assemble-and-publish.result }}
        run: |
          python3 scripts/notify-ci.py finish
