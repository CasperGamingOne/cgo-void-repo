name: "Package Request Status Notifications"

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  notify-requester:
    name: "Dispatch Discord DM Status Alert"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Discord DM Dispatcher
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 scripts/notify-requester.py
