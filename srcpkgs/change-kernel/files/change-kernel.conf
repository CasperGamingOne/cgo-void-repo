# /etc/default/change-kernel
# Configuration file for change-kernel utility

# Preferred default kernel at boot:
#   "cachyos" - Automatically selects the latest installed CachyOS LTS kernel
#   "default" - Restores Void Linux standard kernel sorting (latest stock kernel)
#   "/boot/vmlinuz-<version>" - Pins a specific installed kernel version
PREFER_KERNEL="cachyos"
